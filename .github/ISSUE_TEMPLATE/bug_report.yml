name: Bug report
description: Something in dokkup does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here. Use
        [private vulnerability reporting](https://github.com/eduardotorresdev/dokkup/security/advisories/new)
        instead — see [SECURITY.md](https://github.com/eduardotorresdev/dokkup/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: input
    id: dokkup-version
    attributes:
      label: dokkup version
      description: Output of `dokkup version`
    validations:
      required: true

  - type: input
    id: dokku-version
    attributes:
      label: Dokku version
      description: Output of `dokku version`
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host operating system
      placeholder: Ubuntu 24.04, arm64
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: How is dokkup reachable?
      options:
        - Published at a domain, with a certificate
        - By IP address, self-signed certificate
        - By IP address, plain HTTP
        - Not yet installed
    validations:
      required: true

  - type: textarea
    id: dokku-output
    attributes:
      label: Relevant dokku command and its output
      description: >
        If a `dokku` command was involved, paste the exact command and its
        output. That is worth far more than a description of it.
      render: shell

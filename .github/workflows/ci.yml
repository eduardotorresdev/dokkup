name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
        working-directory: web

      - run: bun run check
        working-directory: web

      - run: bun run build
        working-directory: web

      # The Go build embeds this, so every later job gets the same bytes rather
      # than rebuilding and hoping they match.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: internal/server/static/dist
          retention-days: 1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: internal/server/static/dist

      - name: gofmt
        run: |
          unformatted=$(git ls-files -z '*.go' | xargs -0 gofmt -s -l)
          if [ -n "$unformatted" ]; then
            echo "these files need 'make fmt':"
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      # Built from source rather than taken from the action: the published
      # binaries are compiled with an older Go than this module targets, and
      # refuse to load the config when that happens. The version is pinned in
      # the Makefile so local runs and CI cannot drift apart.
      - name: golangci-lint
        run: |
          make tools
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Build and check the weight budget
        run: |
          make build-go
          make budget

  devenv:
    name: Development environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same image definition developers use on macOS under Apple's
      # container runtime. If it stops building here, it has stopped working
      # there too.
      - name: Build the dev environment image
        run: docker build -t dokkup-devenv:ci devenv

      # Apple's runtime gives each container its own lightweight VM, so there
      # `--cap-add ALL` is enough for systemd and for the Docker daemon Dokku
      # needs. Docker shares the host kernel, so the same image only boots here
      # with a writable cgroup hierarchy, tmpfs for /run, and --privileged.
      - name: Boot it and install Dokku
        run: |
          docker run -d --name dokkup-devenv \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /run \
            --tmpfs /run/lock \
            dokkup-devenv:ci

          for _ in $(seq 1 180); do
            if docker exec dokkup-devenv dokku apps:list >/dev/null 2>&1; then
              echo "Dokku ready: $(docker exec dokkup-devenv dokku version)"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' dokkup-devenv)" != true ]; then
              echo "the container stopped on its own" >&2
              break
            fi
            sleep 5
          done

          echo "Dokku did not become ready" >&2
          docker inspect -f 'state: {{.State.Status}} exit: {{.State.ExitCode}}' dokkup-devenv || true
          docker logs --tail 50 dokkup-devenv || true
          docker exec dokkup-devenv systemctl --failed --no-pager || true
          docker exec dokkup-devenv journalctl -u dokku-bootstrap --no-pager 2>&1 | tail -50 || true
          exit 1

      - name: Check for failed units
        run: docker exec dokkup-devenv systemctl --failed --no-pager

      - if: always()
        run: docker rm -f dokkup-devenv || true

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every tracked script, rather than a list someone has to remember to add
      # to. install.sh and the release script are both run by people who did not
      # write them, one as root.
      - name: shellcheck
        run: git ls-files '*.sh' | xargs shellcheck
